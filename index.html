<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Biên Phòng Nước An Toàn - Cổng PWA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --primary:#0284C7; --primary-light:#38BDF8;
    --amber:#F59E0B; --amber-light:#FBBF24;
    --ok:#10B981; --bad:#EF4444; --warn:#F97316;
    --ink:#0F2A43;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Nunito','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(160deg,#F0F9FF,#FEF9C3 35%,#FDF2F8 70%,#F0FDF4);
    display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;
  }
  .portal{
    text-align:center;padding:40px 28px;
    background:rgba(255,255,255,.75);backdrop-filter:blur(14px);
    border-radius:32px;border-bottom:6px solid #BFDBFE;
    box-shadow:0 8px 0 #BFDBFE,0 15px 25px rgba(0,0,0,.08);
    max-width:520px;
  }
  .badge{font-size:64px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  h1{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;color:var(--primary);margin:10px 0 6px}
  p{font-weight:700;color:#3B6B8F}
  .dots span{display:inline-block;width:10px;height:10px;margin:14px 3px 0;border-radius:50%;background:var(--amber);animation:dot 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
  .note{margin-top:14px;font-size:12px;font-weight:700;color:#7A93A8}
</style>
</head>
<body>
  <main class="portal" role="status">
    <div class="badge" aria-hidden="true">🌊🦺</div>
    <h1>An Toàn Dưới Nước — Trường Học Số</h1>
    <p>Đang mở thư viện trò chơi giáo dục…</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="note">PWA offline • Đăng ký Service Worker tự động</div>
  </main>

  <noscript>
    <div style="position:fixed;inset:auto 0 0 0;background:#fff3f0;padding:12px;text-align:center;font-weight:800;color:#B91C1C">
      Vui lòng bật JavaScript — hoặc nhấn <a href="games/index.html">vào thư viện trò chơi</a>.
    </noscript>

<script>
(function(){
  // Tự động đăng ký Service Worker (PWA 100% offline)
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')
        .then(function(reg){ console.info('[PWA] SW registered:', reg.scope); })
        .catch(function(err){ console.warn('[PWA] SW failed:', err.message); });
    });
  }
  // Chuyển hướng sang cổng thư viện
  setTimeout(function(){ location.replace('games/index.html'); }, 900);
})();
</script>
</body>
</html>
